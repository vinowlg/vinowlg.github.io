<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 450">
  <defs>
    <filter id="sk" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.85" fill="#0B3D2E" opacity="0.11"/>
    </pattern>
  </defs>
  <rect width="1050" height="450" fill="#faf9f2"/>
  <rect width="1050" height="450" fill="url(#g)"/>

  <!-- outer faint rings -->
  <g fill="none" stroke="#0B3D2E" opacity="0.07" filter="url(#sk)">
    <circle cx="525" cy="225" r="180" stroke-width="0.8"/>
    <circle cx="525" cy="225" r="240" stroke-width="0.6" stroke-dasharray="6 6"/>
    <circle cx="525" cy="225" r="300" stroke-width="0.5" stroke-dasharray="3 8"/>
  </g>

  <!-- spoke lines to satellite nodes -->
  <g stroke="#0B3D2E" stroke-width="1" opacity="0.28" filter="url(#sk)">
    <!-- 6 spokes at 0° 60° 120° 180° 240° 300° -->
    <line x1="525" y1="225" x2="525" y2="55"/>
    <line x1="525" y1="225" x2="672" y2="140"/>
    <line x1="525" y1="225" x2="672" y2="310"/>
    <line x1="525" y1="225" x2="525" y2="395"/>
    <line x1="525" y1="225" x2="378" y2="310"/>
    <line x1="525" y1="225" x2="378" y2="140"/>
  </g>
  <!-- secondary cross-connections between satellites -->
  <g stroke="#0B3D2E" stroke-width="0.6" opacity="0.12" filter="url(#sk)">
    <line x1="525" y1="55" x2="672" y2="140"/>
    <line x1="672" y1="140" x2="672" y2="310"/>
    <line x1="672" y1="310" x2="525" y2="395"/>
    <line x1="525" y1="395" x2="378" y2="310"/>
    <line x1="378" y1="310" x2="378" y2="140"/>
    <line x1="378" y1="140" x2="525" y2="55"/>
    <!-- skip connections -->
    <line x1="525" y1="55" x2="672" y2="310"/>
    <line x1="672" y1="140" x2="525" y2="395"/>
    <line x1="672" y1="310" x2="378" y2="140"/>
  </g>

  <!-- satellite nodes -->
  <g filter="url(#sk)" fill="#faf9f2" stroke="#0B3D2E" stroke-width="1.3">
    <circle cx="525" cy="55" r="26"/>
    <circle cx="672" cy="140" r="26"/>
    <circle cx="672" cy="310" r="26"/>
    <circle cx="525" cy="395" r="26"/>
    <circle cx="378" cy="310" r="26"/>
    <circle cx="378" cy="140" r="26"/>
  </g>
  <!-- satellite inner dots -->
  <g fill="#0B3D2E" opacity="0.35" filter="url(#sk)">
    <circle cx="525" cy="55" r="5"/>
    <circle cx="672" cy="140" r="5"/>
    <circle cx="672" cy="310" r="5"/>
    <circle cx="525" cy="395" r="5"/>
    <circle cx="378" cy="310" r="5"/>
    <circle cx="378" cy="140" r="5"/>
  </g>

  <!-- satellite labels -->
  <g font-family="'Courier New',monospace" fill="#0B3D2E" opacity="0.6" text-anchor="middle" font-size="8.5" letter-spacing="1">
    <text x="525" y="29">PERCEIVE</text>
    <text x="710" y="120">RETRIEVE</text>
    <text x="714" y="332">REASON</text>
    <text x="525" y="436">PLAN</text>
    <text x="338" y="332">ACT</text>
    <text x="336" y="120">LEARN</text>
  </g>

  <!-- center cluster -->
  <g filter="url(#sk)">
    <circle cx="525" cy="225" r="75" fill="rgba(11,61,46,0.055)" stroke="#0B3D2E" stroke-width="1.7"/>
    <circle cx="525" cy="225" r="46" fill="none" stroke="#0B3D2E" stroke-width="0.8" opacity="0.3"/>
    <!-- inner circuit lines -->
    <line x1="525" y1="158" x2="525" y2="292" stroke="#0B3D2E" stroke-width="0.9" opacity="0.22"/>
    <line x1="458" y1="225" x2="592" y2="225" stroke="#0B3D2E" stroke-width="0.9" opacity="0.22"/>
    <line x1="478" y1="178" x2="572" y2="272" stroke="#0B3D2E" stroke-width="0.6" opacity="0.14"/>
    <line x1="572" y1="178" x2="478" y2="272" stroke="#0B3D2E" stroke-width="0.6" opacity="0.14"/>
    <!-- inner nodes -->
    <circle cx="525" cy="179" r="5" fill="#0B3D2E" opacity="0.28"/>
    <circle cx="571" cy="225" r="5" fill="#0B3D2E" opacity="0.28"/>
    <circle cx="525" cy="271" r="5" fill="#0B3D2E" opacity="0.28"/>
    <circle cx="479" cy="225" r="5" fill="#0B3D2E" opacity="0.28"/>
    <!-- maroon core -->
    <circle cx="525" cy="225" r="18" fill="rgba(122,32,54,0.10)" stroke="#7A2036" stroke-width="1.4"/>
    <circle cx="525" cy="225" r="6" fill="#7A2036" opacity="0.4"/>
  </g>

  <!-- left panel: input data stack -->
  <g filter="url(#sk)" fill="rgba(11,61,46,0.04)" stroke="#0B3D2E" stroke-width="1.1" stroke-linejoin="round" opacity="0.7">
    <rect x="52" y="155" width="90" height="16" rx="2"/>
    <rect x="52" y="178" width="90" height="16" rx="2"/>
    <rect x="52" y="201" width="90" height="16" rx="2"/>
    <rect x="52" y="224" width="90" height="16" rx="2"/>
    <rect x="52" y="247" width="90" height="16" rx="2"/>
  </g>
  <g stroke="#0B3D2E" stroke-width="0.6" opacity="0.2" filter="url(#sk)">
    <line x1="62" y1="163" x2="132" y2="163"/>
    <line x1="62" y1="186" x2="132" y2="186"/>
    <line x1="62" y1="209" x2="105" y2="209"/>
    <line x1="62" y1="232" x2="125" y2="232"/>
    <line x1="62" y1="255" x2="132" y2="255"/>
  </g>
  <line x1="142" y1="225" x2="200" y2="225" stroke="#0B3D2E" stroke-width="1" stroke-dasharray="3 3" opacity="0.35" filter="url(#sk)"/>
  <text x="97" y="144" font-family="'Courier New',monospace" font-size="8" fill="#0B3D2E" opacity="0.4" text-anchor="middle" letter-spacing="1">KNOWLEDGE</text>
  <text x="97" y="155" font-family="'Courier New',monospace" font-size="8" fill="#0B3D2E" opacity="0.4" text-anchor="middle" letter-spacing="1">BASE</text>

  <!-- right panel: output boxes -->
  <g filter="url(#sk)" fill="rgba(122,32,54,0.05)" stroke="#7A2036" stroke-width="1.1" stroke-linejoin="round" opacity="0.8">
    <rect x="908" y="168" width="90" height="28" rx="3"/>
    <rect x="908" y="208" width="90" height="28" rx="3"/>
    <rect x="908" y="248" width="90" height="28" rx="3"/>
  </g>
  <g font-family="'Courier New',monospace" fill="#7A2036" text-anchor="middle" font-size="7.5" letter-spacing="0.8" opacity="0.65">
    <text x="953" y="186">ANSWER</text>
    <text x="953" y="226">INSIGHT</text>
    <text x="953" y="266">ACTION</text>
  </g>
  <line x1="848" y1="225" x2="906" y2="225" stroke="#0B3D2E" stroke-width="1" stroke-dasharray="3 3" opacity="0.35" filter="url(#sk)"/>

  <text x="54" y="38" font-family="'Courier New',monospace" font-size="7.5" fill="#0B3D2E" opacity="0.28" letter-spacing="1">KALI — AI REASONING ARCHITECTURE</text>
  <line x1="54" y1="42" x2="320" y2="42" stroke="#0B3D2E" stroke-width="0.5" opacity="0.2"/>
  <text x="996" y="432" font-family="'Courier New',monospace" font-size="7" fill="#0B3D2E" opacity="0.22" text-anchor="end" letter-spacing="1">FIG 03</text>
</svg>
