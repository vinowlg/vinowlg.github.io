<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.85" fill="#0B3D2E" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="500" height="400" fill="#faf9f2"/>
  <rect width="500" height="400" fill="url(#g)"/>

  <!-- input connectors (left side) -->
  <g stroke="#0B3D2E" stroke-width="0.9" opacity="0.38" filter="url(#sk)" stroke-dasharray="4 3">
    <line x1="100" y1="148" x2="216" y2="200"/>
    <line x1="100" y1="200" x2="215" y2="210"/>
    <line x1="100" y1="252" x2="216" y2="220"/>
  </g>
  <!-- output connectors (right side) -->
  <g stroke="#0B3D2E" stroke-width="0.9" opacity="0.38" filter="url(#sk)" stroke-dasharray="4 3">
    <line x1="285" y1="200" x2="400" y2="155"/>
    <line x1="285" y1="210" x2="400" y2="210"/>
    <line x1="285" y1="220" x2="400" y2="265"/>
  </g>
  <!-- output arrowheads -->
  <g stroke="#0B3D2E" stroke-width="0.9" opacity="0.5" filter="url(#sk)">
    <polyline points="394,149 400,155 394,161" fill="none"/>
    <polyline points="394,204 400,210 394,216" fill="none"/>
    <polyline points="394,259 400,265 394,271" fill="none"/>
  </g>

  <!-- input boxes -->
  <g filter="url(#sk)" fill="rgba(11,61,46,0.05)" stroke="#0B3D2E" stroke-width="1.1" stroke-linejoin="round">
    <rect x="28" y="132" width="72" height="28" rx="3"/>
    <rect x="28" y="186" width="72" height="28" rx="3"/>
    <rect x="28" y="240" width="72" height="28" rx="3"/>
  </g>
  <g font-family="'Courier New',monospace" text-anchor="middle" fill="#0B3D2E" opacity="0.58" font-size="7.5" letter-spacing="0.8">
    <text x="64" y="150">WORKFLOW</text>
    <text x="64" y="204">DATA</text>
    <text x="64" y="258">SYSTEMS</text>
  </g>

  <!-- output boxes -->
  <g filter="url(#sk)" fill="rgba(122,32,54,0.06)" stroke="#7A2036" stroke-width="1.1" stroke-linejoin="round">
    <rect x="400" y="139" width="72" height="28" rx="3"/>
    <rect x="400" y="196" width="72" height="28" rx="3"/>
    <rect x="400" y="253" width="72" height="28" rx="3"/>
  </g>
  <g font-family="'Courier New',monospace" text-anchor="middle" fill="#7A2036" opacity="0.62" font-size="7.5" letter-spacing="0.8">
    <text x="436" y="157">EMAILS</text>
    <text x="436" y="214">REPORTS</text>
    <text x="436" y="271">ACTIONS</text>
  </g>

  <!-- human-in-the-loop indicator (top) -->
  <g filter="url(#sk)">
    <circle cx="250" cy="104" r="22" fill="rgba(11,61,46,0.04)" stroke="#0B3D2E" stroke-width="1.1" stroke-dasharray="4 3"/>
    <!-- person outline simplified -->
    <circle cx="250" cy="97" r="7" fill="none" stroke="#0B3D2E" stroke-width="1" opacity="0.5"/>
    <path d="M238,118 Q250,110 262,118" fill="none" stroke="#0B3D2E" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- approval line down to agent -->
  <line x1="250" y1="126" x2="250" y2="172" stroke="#0B3D2E" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.35" filter="url(#sk)"/>
  <text x="250" y="89" font-family="'Courier New',monospace" font-size="7" fill="#0B3D2E" opacity="0.38" text-anchor="middle" letter-spacing="1">HUMAN</text>

  <!-- agent center (hexagon using polygon) -->
  <g filter="url(#sk)">
    <polygon points="250,172 285,191 285,229 250,248 215,229 215,191" fill="rgba(11,61,46,0.06)" stroke="#0B3D2E" stroke-width="1.6"/>
    <!-- inner details -->
    <circle cx="250" cy="210" r="18" fill="none" stroke="#0B3D2E" stroke-width="0.7" opacity="0.28"/>
    <line x1="250" y1="183" x2="250" y2="237" stroke="#0B3D2E" stroke-width="0.7" opacity="0.2"/>
    <line x1="220" y1="210" x2="280" y2="210" stroke="#0B3D2E" stroke-width="0.7" opacity="0.2"/>
    <circle cx="250" cy="210" r="8" fill="rgba(122,32,54,0.10)" stroke="#7A2036" stroke-width="1.3"/>
    <circle cx="250" cy="210" r="3" fill="#7A2036" opacity="0.45"/>
  </g>
  <text x="250" y="276" font-family="'Courier New',monospace" font-size="8.5" fill="#0B3D2E" opacity="0.45" text-anchor="middle" letter-spacing="1.5">AI AGENT</text>

  <text x="34" y="30" font-family="'Courier New',monospace" font-size="7.5" fill="#0B3D2E" opacity="0.28" letter-spacing="1">KALI AGENTS — BUSINESS AUTOMATION</text>
  <line x1="34" y1="34" x2="270" y2="34" stroke="#0B3D2E" stroke-width="0.5" opacity="0.2"/>
  <text x="466" y="388" font-family="'Courier New',monospace" font-size="7" fill="#0B3D2E" opacity="0.22" text-anchor="end" letter-spacing="1">FIG 05</text>
</svg>
