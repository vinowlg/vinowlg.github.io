<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 450">
  <defs>
    <filter id="sk" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.85" fill="#0B3D2E" opacity="0.11"/>
    </pattern>
  </defs>
  <rect width="1050" height="450" fill="#faf9f2"/>
  <rect width="1050" height="450" fill="url(#g)"/>

  <!-- terminal window (left 62%) -->
  <g filter="url(#sk)">
    <!-- window outer frame -->
    <rect x="52" y="58" width="606" height="334" rx="6" fill="rgba(11,61,46,0.04)" stroke="#0B3D2E" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- title bar -->
    <rect x="52" y="58" width="606" height="32" rx="6" fill="rgba(11,61,46,0.06)" stroke="#0B3D2E" stroke-width="1.4" stroke-linejoin="round"/>
    <line x1="52" y1="90" x2="658" y2="90" stroke="#0B3D2E" stroke-width="1" opacity="0.3"/>
    <!-- traffic lights -->
    <circle cx="80" cy="74" r="6" fill="none" stroke="#0B3D2E" stroke-width="1" opacity="0.4"/>
    <circle cx="100" cy="74" r="6" fill="none" stroke="#0B3D2E" stroke-width="1" opacity="0.4"/>
    <circle cx="120" cy="74" r="6" fill="none" stroke="#0B3D2E" stroke-width="1" opacity="0.4"/>
    <!-- title text -->
    <text x="355" y="79" font-family="'Courier New',monospace" font-size="9" fill="#0B3D2E" opacity="0.45" text-anchor="middle" letter-spacing="1">kali-suite — test runner</text>
  </g>

  <!-- terminal content — monospace lines -->
  <g font-family="'Courier New',monospace" font-size="10.5" fill="#0B3D2E" letter-spacing="0.3">
    <text x="76" y="120" opacity="0.55">$ kali-suite run --suite regression --env staging</text>
    <text x="76" y="140" opacity="0.32">  resolving 48 test cases across 6 suites...</text>
    <text x="76" y="160" opacity="0.32">  spawning 8 concurrent workers</text>
    <text x="76" y="185" opacity="0.6">  ✓  login.happy_path             <tspan opacity="0.4">12ms</tspan></text>
    <text x="76" y="204" opacity="0.6">  ✓  login.mfa_flow               <tspan opacity="0.4">34ms</tspan></text>
    <text x="76" y="223" opacity="0.6">  ✓  checkout.add_to_cart         <tspan opacity="0.4">28ms</tspan></text>
    <text x="76" y="242" fill="#7A2036" opacity="0.75">  ✗  payment.card_declined        <tspan opacity="0.6">FAIL</tspan></text>
    <text x="76" y="261" opacity="0.6">  ✓  api.order.create             <tspan opacity="0.4">9ms</tspan></text>
    <text x="76" y="280" opacity="0.6">  ✓  api.order.status             <tspan opacity="0.4">7ms</tspan></text>
    <text x="76" y="299" opacity="0.6">  ✓  api.inventory.check          <tspan opacity="0.4">11ms</tspan></text>
    <text x="76" y="318" opacity="0.32">  ...</text>
    <text x="76" y="344" opacity="0.45">  47 passed   1 failed   0 errors   141ms total</text>
    <text x="76" y="367" fill="#7A2036" opacity="0.6">  → AI agent triaging payment.card_declined...</text>
  </g>
  <!-- cursor blink placeholder -->
  <rect x="76" y="372" width="8" height="12" fill="#0B3D2E" opacity="0.35" filter="url(#sk)"/>

  <!-- divider -->
  <line x1="692" y1="80" x2="692" y2="374" stroke="#0B3D2E" stroke-width="0.8" stroke-dasharray="5 5" opacity="0.2"/>

  <!-- right panel: metrics -->
  <!-- pass rate donut -->
  <g filter="url(#sk)">
    <!-- background ring -->
    <circle cx="858" cy="180" r="72" fill="none" stroke="#0B3D2E" stroke-width="12" opacity="0.06"/>
    <!-- pass arc (47/48 = 97.9%) — nearly full circle, stroke-dasharray trick -->
    <!-- circumference = 2π×72 ≈ 452.4 -->
    <!-- 97.9% of 452.4 ≈ 442.9 -->
    <circle cx="858" cy="180" r="72" fill="none" stroke="#0B3D2E" stroke-width="12" opacity="0.35"
      stroke-dasharray="443 452" stroke-dashoffset="113" stroke-linecap="round"/>
    <!-- fail arc -->
    <circle cx="858" cy="180" r="72" fill="none" stroke="#7A2036" stroke-width="12" opacity="0.6"
      stroke-dasharray="9 452" stroke-dashoffset="-330" stroke-linecap="round"/>
    <!-- center label -->
    <text x="858" y="174" font-family="'Courier New',monospace" font-size="22" fill="#0B3D2E" opacity="0.65" text-anchor="middle" font-weight="bold">97.9</text>
    <text x="858" y="192" font-family="'Courier New',monospace" font-size="9" fill="#0B3D2E" opacity="0.4" text-anchor="middle" letter-spacing="1">% PASS</text>
  </g>

  <!-- stat boxes -->
  <g filter="url(#sk)" fill="rgba(11,61,46,0.04)" stroke="#0B3D2E" stroke-width="1" stroke-linejoin="round">
    <rect x="718" y="292" width="108" height="48" rx="3"/>
    <rect x="840" y="292" width="108" height="48" rx="3"/>
    <rect x="718" y="352" width="108" height="36" rx="3"/>
    <rect x="840" y="352" width="108" height="36" rx="3"/>
  </g>
  <g font-family="'Courier New',monospace" text-anchor="middle" fill="#0B3D2E">
    <text x="772" y="314" font-size="18" opacity="0.6">47</text>
    <text x="772" y="330" font-size="7.5" opacity="0.38" letter-spacing="0.8">PASSED</text>
    <text x="894" y="314" font-size="18" fill="#7A2036" opacity="0.65">1</text>
    <text x="894" y="330" font-size="7.5" opacity="0.38" letter-spacing="0.8">FAILED</text>
    <text x="772" y="374" font-size="10" opacity="0.55">141ms</text>
    <text x="894" y="374" font-size="10" opacity="0.55">8 workers</text>
  </g>

  <text x="54" y="38" font-family="'Courier New',monospace" font-size="7.5" fill="#0B3D2E" opacity="0.28" letter-spacing="1">KALI SUITE — AUTOMATED TEST RUNNER</text>
  <line x1="54" y1="42" x2="310" y2="42" stroke="#0B3D2E" stroke-width="0.5" opacity="0.2"/>
  <text x="996" y="432" font-family="'Courier New',monospace" font-size="7" fill="#0B3D2E" opacity="0.22" text-anchor="end" letter-spacing="1">FIG 07</text>
</svg>
