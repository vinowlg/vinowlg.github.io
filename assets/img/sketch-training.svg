<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.85" fill="#0B3D2E" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="500" height="400" fill="#faf9f2"/>
  <rect width="500" height="400" fill="url(#g)"/>

  <!-- trunk line -->
  <line x1="250" y1="355" x2="250" y2="248" stroke="#0B3D2E" stroke-width="1.8" stroke-linecap="round" opacity="0.55" filter="url(#sk)"/>

  <!-- root node -->
  <g filter="url(#sk)">
    <circle cx="250" cy="355" r="22" fill="rgba(11,61,46,0.07)" stroke="#0B3D2E" stroke-width="1.5"/>
    <circle cx="250" cy="355" r="8" fill="rgba(122,32,54,0.12)" stroke="#7A2036" stroke-width="1.2"/>
  </g>
  <text x="250" y="388" font-family="'Courier New',monospace" font-size="8" fill="#0B3D2E" opacity="0.45" text-anchor="middle" letter-spacing="1">FOUNDATIONS</text>

  <!-- branch lines level 1 -->
  <g stroke="#0B3D2E" stroke-width="1.3" stroke-linecap="round" opacity="0.42" filter="url(#sk)">
    <line x1="250" y1="248" x2="110" y2="190"/>
    <line x1="250" y1="248" x2="250" y2="175"/>
    <line x1="250" y1="248" x2="390" y2="190"/>
  </g>

  <!-- level 1 nodes -->
  <g filter="url(#sk)" fill="rgba(11,61,46,0.055)" stroke="#0B3D2E" stroke-width="1.3">
    <circle cx="110" cy="190" r="20"/>
    <circle cx="250" cy="175" r="20"/>
    <circle cx="390" cy="190" r="20"/>
  </g>
  <g font-family="'Courier New',monospace" text-anchor="middle" fill="#0B3D2E" opacity="0.6" font-size="7.5" letter-spacing="0.8">
    <text x="110" y="192">PROMPTING</text>
    <text x="250" y="177">RAG</text>
    <text x="390" y="192">AGENTS</text>
  </g>

  <!-- branch lines level 2 -->
  <g stroke="#0B3D2E" stroke-width="0.9" stroke-linecap="round" opacity="0.3" filter="url(#sk)">
    <!-- from PROMPTING -->
    <line x1="110" y1="170" x2="64" y2="120"/>
    <line x1="110" y1="170" x2="130" y2="112"/>
    <!-- from RAG -->
    <line x1="250" y1="155" x2="210" y2="106"/>
    <line x1="250" y1="155" x2="290" y2="106"/>
    <!-- from AGENTS -->
    <line x1="390" y1="170" x2="366" y2="112"/>
    <line x1="390" y1="170" x2="430" y2="112"/>
  </g>

  <!-- level 2 nodes -->
  <g filter="url(#sk)" fill="rgba(11,61,46,0.04)" stroke="#0B3D2E" stroke-width="1">
    <circle cx="64" cy="110" r="14"/>
    <circle cx="130" cy="102" r="14"/>
    <circle cx="210" cy="96" r="14"/>
    <circle cx="290" cy="96" r="14"/>
    <circle cx="366" cy="102" r="14"/>
    <circle cx="430" cy="102" r="14"/>
  </g>
  <!-- audience labels -->
  <g font-family="'Courier New',monospace" text-anchor="middle" fill="#0B3D2E" opacity="0.5" font-size="7" letter-spacing="0.5">
    <text x="64" y="108">LEADERSHIP</text>
    <text x="130" y="100">TEAMS</text>
    <text x="210" y="94">ENGINEERS</text>
    <text x="290" y="94">STUDENTS</text>
    <text x="366" y="100">BUILDERS</text>
    <text x="430" y="100">RESEARCH</text>
  </g>

  <!-- certification crown (top center, connecting level 2 nodes) -->
  <g stroke="#7A2036" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.35" filter="url(#sk)">
    <path d="M64,96 Q250,40 430,88" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="250" cy="54" r="16" fill="rgba(122,32,54,0.07)" stroke="#7A2036" stroke-width="1.2"/>
    <!-- star mark -->
    <line x1="250" y1="42" x2="250" y2="66" stroke="#7A2036" stroke-width="1" opacity="0.5"/>
    <line x1="238" y1="54" x2="262" y2="54" stroke="#7A2036" stroke-width="1" opacity="0.5"/>
    <line x1="241" y1="45" x2="259" y2="63" stroke="#7A2036" stroke-width="0.7" opacity="0.3"/>
    <line x1="259" y1="45" x2="241" y2="63" stroke="#7A2036" stroke-width="0.7" opacity="0.3"/>
  </g>
  <text x="250" y="34" font-family="'Courier New',monospace" font-size="7" fill="#7A2036" opacity="0.5" text-anchor="middle" letter-spacing="1">CERTIFICATION</text>

  <text x="34" y="22" font-family="'Courier New',monospace" font-size="7.5" fill="#0B3D2E" opacity="0.28" letter-spacing="1">KALI TRAINING — LEARNING PATHS</text>
  <line x1="34" y1="26" x2="234" y2="26" stroke="#0B3D2E" stroke-width="0.5" opacity="0.2"/>
  <text x="466" y="388" font-family="'Courier New',monospace" font-size="7" fill="#0B3D2E" opacity="0.22" text-anchor="end" letter-spacing="1">FIG 06</text>
</svg>
