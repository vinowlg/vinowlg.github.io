<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 528" role="img" aria-label="An AI agent connected to documents, databases, Jira, CI/CD, a test suite and your team, with an engagement scorecard">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#0B3D2E" opacity=".10"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E3EBE7"/>
      <stop offset="1" stop-color="#E3EBE7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B3D2E" flood-opacity=".14"/>
    </filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B3D2E" flood-opacity=".10"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
      .flow { stroke-dasharray: 3 7; animation: flow 1.6s linear infinite; }
      .pulse { transform-origin: 240px 200px; animation: pulse 3.2s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: .15; transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="480" height="528" fill="#F1EFE8"/>
  <rect width="480" height="528" fill="url(#dots)"/>
  <circle cx="240" cy="200" r="190" fill="url(#glow)"/>

  <!-- connections -->
  <g fill="none" stroke="#7A2036" stroke-width="1.6" stroke-linecap="round" opacity=".6">
    <path class="flow" d="M240 200 Q 170 110 100 72"/>
    <path class="flow" d="M240 200 Q 320 110 386 72"/>
    <path class="flow" d="M240 200 Q 340 200 408 214"/>
    <path class="flow" d="M240 200 Q 140 200 74 222"/>
    <path class="flow" d="M240 200 Q 190 290 124 336"/>
    <path class="flow" d="M240 200 Q 300 290 360 336"/>
  </g>

  <!-- orbit -->
  <circle cx="240" cy="200" r="78" fill="none" stroke="#7A2036" stroke-width="1" stroke-dasharray="2 6" opacity=".45"/>
  <circle cx="240" cy="122" r="5" fill="#7A2036"/>
  <circle cx="172.5" cy="239" r="5" fill="#7A2036"/>
  <circle cx="307.5" cy="239" r="5" fill="#7A2036"/>

  <!-- agent core -->
  <circle class="pulse" cx="240" cy="200" r="56" fill="#0B3D2E" opacity=".35"/>
  <circle cx="240" cy="200" r="52" fill="#FFFFFF" filter="url(#soft)"/>
  <circle cx="240" cy="200" r="42" fill="#0B3D2E"/>
  <text x="240" y="197" text-anchor="middle" class="serif" font-size="17" font-weight="600" fill="#FFFFFF">AI agent</text>
  <text x="240" y="214" text-anchor="middle" font-size="7.5" letter-spacing=".8" fill="#B9CBC3">REASON · ACT</text>

  <!-- nodes -->
  <g font-size="13" font-weight="500" fill="#16201C">
    <g filter="url(#soft)">
      <rect x="40" y="56" width="120" height="32" rx="16" fill="#FFFFFF"/>
      <rect x="326" y="56" width="120" height="32" rx="16" fill="#FFFFFF"/>
      <rect x="360" y="198" width="100" height="32" rx="16" fill="#FFFFFF"/>
      <rect x="20" y="206" width="112" height="32" rx="16" fill="#FFFFFF"/>
      <rect x="60" y="320" width="120" height="32" rx="16" fill="#FFFFFF"/>
      <rect x="300" y="320" width="120" height="32" rx="16" fill="#FFFFFF"/>
    </g>
    <circle cx="58" cy="72" r="4.5" fill="#7A2036"/><text x="70" y="76.5">Documents</text>
    <circle cx="344" cy="72" r="4.5" fill="#7A2036"/><text x="356" y="76.5">Jira issues</text>
    <circle cx="378" cy="214" r="4.5" fill="#7A2036"/><text x="390" y="218.5">CI/CD</text>
    <circle cx="38" cy="222" r="4.5" fill="#7A2036"/><text x="50" y="226.5">Databases</text>
    <circle cx="78" cy="336" r="4.5" fill="#7A2036"/><text x="90" y="340.5">Test suite</text>
    <circle cx="318" cy="336" r="4.5" fill="#0B3D2E"/><text x="330" y="340.5">Your team</text>
  </g>

  <!-- scorecard -->
  <g filter="url(#shadow)">
    <rect x="32" y="384" width="416" height="120" rx="16" fill="#FFFFFF"/>
  </g>
  <text x="52" y="412" font-size="10.5" font-weight="600" letter-spacing="1.3" fill="#7B8480">ENGAGEMENT SCORECARD</text>
  <g font-size="12.5" fill="#4A544F">
    <text x="52" y="440">Answer accuracy</text>
    <text x="52" y="464">Time to triage</text>
    <text x="52" y="488">Cost per task</text>
  </g>
  <g>
    <rect x="178" y="432" width="160" height="8" rx="4" fill="#EEF0EC"/>
    <rect x="178" y="432" width="138" height="8" rx="4" fill="#0B3D2E"/>
    <rect x="178" y="456" width="160" height="8" rx="4" fill="#EEF0EC"/>
    <rect x="178" y="456" width="124" height="8" rx="4" fill="#0B3D2E"/>
    <rect x="178" y="480" width="160" height="8" rx="4" fill="#EEF0EC"/>
    <rect x="178" y="480" width="112" height="8" rx="4" fill="#0B3D2E"/>
    <g stroke="#7A2036" stroke-width="2" stroke-linecap="round">
      <line x1="298" y1="428" x2="298" y2="444"/>
      <line x1="290" y1="452" x2="290" y2="468"/>
      <line x1="282" y1="476" x2="282" y2="492"/>
    </g>
  </g>
  <g font-size="10.5" font-weight="600" fill="#0B3D2E">
    <rect x="354" y="428" width="76" height="17" rx="8.5" fill="#E3EBE7"/><text x="392" y="440" text-anchor="middle">On target</text>
    <rect x="354" y="452" width="76" height="17" rx="8.5" fill="#E3EBE7"/><text x="392" y="464" text-anchor="middle">On target</text>
    <rect x="354" y="476" width="76" height="17" rx="8.5" fill="#E3EBE7"/><text x="392" y="488" text-anchor="middle">On target</text>
  </g>
</svg>
