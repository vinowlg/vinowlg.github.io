<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.85" fill="#0B3D2E" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="500" height="400" fill="#faf9f2"/>
  <rect width="500" height="400" fill="url(#g)"/>

  <!-- CI/CD pipeline top-down -->

  <!-- git commit (top) -->
  <g filter="url(#sk)">
    <circle cx="250" cy="52" r="20" fill="rgba(11,61,46,0.05)" stroke="#0B3D2E" stroke-width="1.3"/>
    <!-- git branch symbol -->
    <circle cx="244" cy="47" r="4" fill="none" stroke="#0B3D2E" stroke-width="1" opacity="0.55"/>
    <circle cx="256" cy="57" r="4" fill="none" stroke="#0B3D2E" stroke-width="1" opacity="0.55"/>
    <line x1="244" y1="51" x2="244" y2="60" stroke="#0B3D2E" stroke-width="0.9" opacity="0.45"/>
    <line x1="244" y1="55" x2="253" y2="57" stroke="#0B3D2E" stroke-width="0.9" opacity="0.45"/>
  </g>
  <text x="250" y="90" font-family="'Courier New',monospace" font-size="8" fill="#0B3D2E" opacity="0.45" text-anchor="middle" letter-spacing="1">GIT PUSH</text>

  <!-- line down -->
  <line x1="250" y1="72" x2="250" y2="106" stroke="#0B3D2E" stroke-width="0.9" opacity="0.4" filter="url(#sk)"/>
  <polyline points="244,100 250,107 256,100" fill="none" stroke="#0B3D2E" stroke-width="0.9" opacity="0.4" filter="url(#sk)"/>

  <!-- CI trigger box -->
  <g filter="url(#sk)" fill="rgba(11,61,46,0.05)" stroke="#0B3D2E" stroke-width="1.2" stroke-linejoin="round">
    <rect x="164" y="108" width="172" height="36" rx="3"/>
  </g>
  <text x="250" y="131" font-family="'Courier New',monospace" font-size="8.5" fill="#0B3D2E" opacity="0.62" text-anchor="middle" letter-spacing="1">CI PIPELINE TRIGGERED</text>

  <!-- lines branching to 3 workers -->
  <g stroke="#0B3D2E" stroke-width="0.9" opacity="0.38" filter="url(#sk)">
    <line x1="250" y1="144" x2="250" y2="160"/>
    <line x1="250" y1="160" x2="96" y2="190"/>
    <line x1="250" y1="160" x2="250" y2="190"/>
    <line x1="250" y1="160" x2="404" y2="190"/>
    <polyline points="90,184 96,191 102,184" fill="none"/>
    <polyline points="244,184 250,191 256,184" fill="none"/>
    <polyline points="398,184 404,191 410,184" fill="none"/>
  </g>

  <!-- 3 worker boxes -->
  <g filter="url(#sk)" fill="rgba(11,61,46,0.05)" stroke="#0B3D2E" stroke-width="1.2" stroke-linejoin="round">
    <rect x="36" y="192" width="120" height="64" rx="3"/>
    <rect x="190" y="192" width="120" height="64" rx="3"/>
    <rect x="344" y="192" width="120" height="64" rx="3"/>
  </g>
  <g font-family="'Courier New',monospace" text-anchor="middle" fill="#0B3D2E" opacity="0.6" font-size="8" letter-spacing="0.8">
    <text x="96" y="215">UI TESTS</text>
    <text x="96" y="230">PLAYWRIGHT</text>
    <text x="96" y="248" font-size="7" opacity="0.5">32 scenarios</text>
    <text x="250" y="215">API TESTS</text>
    <text x="250" y="230">REST / GQL</text>
    <text x="250" y="248" font-size="7" opacity="0.5">11 suites</text>
    <text x="404" y="215">SMOKE</text>
    <text x="404" y="230">CRITICAL PATH</text>
    <text x="404" y="248" font-size="7" opacity="0.5">5 tests</text>
  </g>

  <!-- lines converging to results -->
  <g stroke="#0B3D2E" stroke-width="0.9" opacity="0.38" filter="url(#sk)">
    <line x1="96" y1="256" x2="96" y2="280"/>
    <line x1="250" y1="256" x2="250" y2="280"/>
    <line x1="404" y1="256" x2="404" y2="280"/>
    <line x1="96" y1="280" x2="250" y2="308"/>
    <line x1="250" y1="280" x2="250" y2="308"/>
    <line x1="404" y1="280" x2="250" y2="308"/>
    <polyline points="244,302 250,309 256,302" fill="none"/>
  </g>

  <!-- results box -->
  <g filter="url(#sk)" fill="rgba(122,32,54,0.06)" stroke="#7A2036" stroke-width="1.3" stroke-linejoin="round">
    <rect x="156" y="310" width="188" height="54" rx="4"/>
  </g>
  <!-- results content -->
  <g font-family="'Courier New',monospace" text-anchor="middle" fill="#0B3D2E" opacity="0.65" font-size="9" letter-spacing="0.8">
    <text x="250" y="332">47 ✓  ·  1 ✗  ·  141ms</text>
  </g>
  <text x="250" y="350" font-family="'Courier New',monospace" font-size="7.5" fill="#7A2036" opacity="0.6" text-anchor="middle" letter-spacing="0.8">AI TRIAGE IN PROGRESS</text>

  <text x="34" y="30" font-family="'Courier New',monospace" font-size="7.5" fill="#0B3D2E" opacity="0.28" letter-spacing="1">KALI SUITE — SCALABLE CI/CD RUNNER</text>
  <line x1="34" y1="34" x2="264" y2="34" stroke="#0B3D2E" stroke-width="0.5" opacity="0.2"/>
  <text x="466" y="388" font-family="'Courier New',monospace" font-size="7" fill="#0B3D2E" opacity="0.22" text-anchor="end" letter-spacing="1">FIG 09</text>
</svg>
