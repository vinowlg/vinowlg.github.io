<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.85" fill="#0B3D2E" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="500" height="400" fill="#faf9f2"/>
  <rect width="500" height="400" fill="url(#g)"/>

  <!-- vertical spine -->
  <line x1="250" y1="52" x2="250" y2="360" stroke="#0B3D2E" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.22" filter="url(#sk)"/>

  <!-- step connectors -->
  <g stroke="#0B3D2E" stroke-width="0.9" opacity="0.4" filter="url(#sk)">
    <line x1="250" y1="100" x2="250" y2="140"/>
    <line x1="250" y1="188" x2="250" y2="228"/>
    <line x1="250" y1="276" x2="250" y2="316"/>
    <!-- arrowheads -->
    <polyline points="245,136 250,141 255,136" fill="none"/>
    <polyline points="245,224 250,229 255,224" fill="none"/>
    <polyline points="245,312 250,317 255,312" fill="none"/>
  </g>

  <!-- step boxes -->
  <g filter="url(#sk)" stroke-linejoin="round" stroke-width="1.3">
    <rect x="136" y="44" width="228" height="56" rx="4" fill="rgba(11,61,46,0.05)" stroke="#0B3D2E"/>
    <rect x="136" y="140" width="228" height="56" rx="4" fill="rgba(11,61,46,0.05)" stroke="#0B3D2E"/>
    <rect x="136" y="228" width="228" height="56" rx="4" fill="rgba(11,61,46,0.05)" stroke="#0B3D2E"/>
    <rect x="136" y="316" width="228" height="56" rx="4" fill="rgba(122,32,54,0.07)" stroke="#7A2036" stroke-width="1.4"/>
  </g>

  <!-- step numbers (maroon circles) -->
  <g filter="url(#sk)">
    <circle cx="155" cy="72" r="12" fill="rgba(122,32,54,0.08)" stroke="#7A2036" stroke-width="1.2"/>
    <circle cx="155" cy="168" r="12" fill="rgba(122,32,54,0.08)" stroke="#7A2036" stroke-width="1.2"/>
    <circle cx="155" cy="256" r="12" fill="rgba(122,32,54,0.08)" stroke="#7A2036" stroke-width="1.2"/>
    <circle cx="155" cy="344" r="12" fill="rgba(122,32,54,0.12)" stroke="#7A2036" stroke-width="1.4"/>
  </g>
  <g font-family="'Courier New',monospace" text-anchor="middle" fill="#7A2036" font-size="9" font-weight="bold" opacity="0.8">
    <text x="155" y="76">1</text>
    <text x="155" y="172">2</text>
    <text x="155" y="260">3</text>
    <text x="155" y="348">4</text>
  </g>

  <!-- step labels -->
  <g font-family="'Courier New',monospace" text-anchor="middle" fill="#0B3D2E" opacity="0.72" letter-spacing="1.2">
    <text x="270" y="70" font-size="9.5">DEFINE</text>
    <text x="270" y="84" font-size="7.5" opacity="0.6">outcomes &amp; metrics</text>
    <text x="270" y="166" font-size="9.5">BASELINE</text>
    <text x="270" y="180" font-size="7.5" opacity="0.6">measure before we change</text>
    <text x="270" y="254" font-size="9.5">BUILD &amp; MEASURE</text>
    <text x="270" y="268" font-size="7.5" opacity="0.6">ship in increments</text>
    <text x="270" y="342" font-size="9.5" fill="#7A2036">HAND OVER</text>
    <text x="270" y="356" font-size="7.5" fill="#7A2036" opacity="0.65">sign off on the numbers</text>
  </g>

  <text x="34" y="30" font-family="'Courier New',monospace" font-size="7.5" fill="#0B3D2E" opacity="0.28" letter-spacing="1">KALI — ENGAGEMENT PROCESS</text>
  <line x1="34" y1="34" x2="248" y2="34" stroke="#0B3D2E" stroke-width="0.5" opacity="0.2"/>
  <text x="466" y="388" font-family="'Courier New',monospace" font-size="7" fill="#0B3D2E" opacity="0.22" text-anchor="end" letter-spacing="1">FIG 02</text>
</svg>
